# Checkov for platform Terraform roots (bootstrap / shared-edge / shared-obs).
# CI: `.github/workflows/terraform-plan.yml` job "IaC policy (Checkov)".
# How to add/remove skips: docs/iac-policy.md
compact: true
framework:
  - terraform
download-external-modules: false
quiet: true

skip-check:
  # Bootstrap state bucket: SSE-S3 AES256 intentional; single-region eu-north-1.
  - CKV_AWS_145
  - CKV_AWS_19
  - CKV_AWS_144
  - CKV_AWS_18
  - CKV2_AWS_61
  - CKV_AWS_21
  # Event notifications — not used; no downstream consumers of state-bucket events.
  - CKV2_AWS_62
  # shared-mail SNS topic platform-mail-events: SES and CloudWatch can only publish to a CMK-encrypted topic,
  # and the topic only carries bounce/complaint event metadata that is delivered as plain email to the operator.
  # A CMK and its key policy (which also trips the IAM wildcard checks) add cost and failure modes without protecting
  # anything. Revisit if a non-email consumer is added.
  - CKV_AWS_26
