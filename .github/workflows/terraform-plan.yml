name: Terraform plan

# Platform: fmt / Checkov / validate (local apply; OIDC remote plan is a later add).
on:
  push:
    branches:
      - staging
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: terraform-plan-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"

jobs:
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.flags.outputs.any }}
      validate_matrix: ${{ steps.flags.outputs.validate_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow:
              - '.github/workflows/terraform-plan.yml'
            bootstrap:
              - 'infra/terraform/bootstrap/**'
            shared_edge:
              - 'infra/terraform/shared-edge/**'
            shared_obs:
              - 'infra/terraform/shared-obs/**'
            any:
              - 'infra/terraform/**'
              - '.github/workflows/terraform-plan.yml'

      - name: Build job matrices
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
            bootstrap=true
            shared_edge=true
            shared_obs=true
            any=true
          else
            bootstrap=${{ steps.filter.outputs.bootstrap }}
            shared_edge=${{ steps.filter.outputs.shared_edge }}
            shared_obs=${{ steps.filter.outputs.shared_obs }}
            any=${{ steps.filter.outputs.any }}
          fi
          validate='[]'
          append() {
            local -n arr=$1
            local item=$2
            arr=$(jq -c --argjson item "$item" '. + [$item]' <<<"$arr")
          }
          if [ "$bootstrap" = "true" ]; then
            append validate '{"root":"bootstrap","path":"infra/terraform/bootstrap"}'
          fi
          if [ "$shared_edge" = "true" ]; then
            append validate '{"root":"shared-edge","path":"infra/terraform/shared-edge"}'
          fi
          if [ "$shared_obs" = "true" ]; then
            append validate '{"root":"shared-obs","path":"infra/terraform/shared-obs"}'
          fi
          {
            echo "any=${any}"
            echo "validate_matrix=${validate}"
          } >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/terraform

  policy:
    name: IaC policy (Checkov)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: infra/terraform
          config_file: infra/terraform/.checkov.yaml
          framework: terraform
          soft_fail: false
          download_external_modules: false
          output_format: cli

  validate:
    name: Validate (${{ matrix.root }})
    needs:
      - changes
      - fmt
    if: needs.changes.outputs.validate_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.validate_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: terraform init (-backend=false)
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.path }}
        run: terraform validate -no-color
