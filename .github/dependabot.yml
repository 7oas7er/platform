version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /infra/terraform/shared-edge
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform

  - package-ecosystem: terraform
    directory: /infra/terraform/shared-obs
    schedule:
      interval: weekly
      day: monday
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform
